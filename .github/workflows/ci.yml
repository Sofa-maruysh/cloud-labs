name: Lab 3 - GOOD pipeline

on:
  push:
    branches:
      - feature/lab-3

env:
  IMAGE_NAME: cloud-lab3-backend

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: lab-3/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd lab-3/backend
          pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff
        run: |
          cd lab-3/backend
          pip install ruff==0.6.9
          ruff check app.py || true

      - name: Run tests
        run: |
          cd lab-3/backend
          python -m pytest -v

  build-scan-push:
    name: Build, Scan, Push
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: lab-3/backend
          file: lab-3/backend/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy-and-verify:
    name: Deploy and Verify
    runs-on: ubuntu-latest
    needs: build-scan-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run PostgreSQL
        run: |
          docker run -d --name lab3-db \
            -e POSTGRES_USER=labuser \
            -e POSTGRES_PASSWORD=labpass \
            -e POSTGRES_DB=labdb \
            postgres:17.6-alpine3.22

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec lab3-db pg_isready -U labuser -d labdb > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done
          echo "PostgreSQL did not start in time"
          exit 1

      - name: Run backend
        run: |
          docker run -d --name lab3-backend \
            --link lab3-db:db \
            -e DATABASE_URL=postgresql://labuser:labpass@db:5432/labdb \
            -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/healthz > /dev/null 2>&1; then
              echo "Backend is alive"
              exit 0
            fi
            echo "Waiting for backend... ($i)"
            sleep 2
          done
          echo "Backend did not start in time"
          docker logs lab3-backend
          exit 1

      - name: Verify live service
        run: |
          echo "=== curl /api/healthz ==="
          curl -sS -w "\nHTTP %{http_code}\n" http://localhost:5000/api/healthz
          echo ""
          echo "=== curl /api/tasks ==="
          curl -sS -w "\nHTTP %{http_code}\n" http://localhost:5000/api/tasks

      - name: Show backend logs
        if: always()
        run: docker logs lab3-backend || true