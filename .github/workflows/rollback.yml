name: Lab 3 - Rollback

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Тег для отката (рабочий тег, например latest)'
        required: true
        default: 'latest'
      reason:
        description: 'Причина отката'
        required: false
        default: 'demo rollback'
  push:
    branches:
      - feature/lab-3
    paths:
      - 'rollback-trigger.txt'

env:
  IMAGE_NAME: cloud-lab3-backend

jobs:
  rollback:
    name: Rollback to ${{ github.event.inputs.target_tag || 'latest' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show rollback context
        run: |
          echo "=== ROLLBACK STARTED ==="
          echo "Target tag: ${{ github.event.inputs.target_tag || 'latest' }}"
          echo "Reason: ${{ github.event.inputs.reason || 'push trigger' }}"
          echo "Actor: ${{ github.actor }}"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull rollback image
        run: |
          TAG="${{ github.event.inputs.target_tag || 'latest' }}"
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:$TAG

      - name: Start PostgreSQL
        run: |
          docker run -d --name lab3-db \
            -e POSTGRES_USER=labuser \
            -e POSTGRES_PASSWORD=labpass \
            -e POSTGRES_DB=labdb \
            postgres:17.6-alpine3.22

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec lab3-db pg_isready -U labuser -d labdb > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Start rolled-back backend (with timing)
        run: |
          TAG="${{ github.event.inputs.target_tag || 'latest' }}"
          START=$(date +%s)
          docker run -d --name lab3-backend \
            --link lab3-db:db \
            -e DATABASE_URL=postgresql://labuser:labpass@db:5432/labdb \
            -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:$TAG
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/healthz > /dev/null 2>&1; then
              END=$(date +%s)
              echo "Rollback took $((END-START)) seconds"
              break
            fi
            sleep 1
          done

      - name: Verify service is alive after rollback
        run: |
          echo "=== curl /api/healthz ==="
          curl -sS -w "\nHTTP %{http_code}\n" http://localhost:5000/api/healthz
          echo ""
          echo "=== curl /api/tasks ==="
          curl -sS -w "\nHTTP %{http_code}\n" http://localhost:5000/api/tasks

      - name: Show backend logs
        if: always()
        run: docker logs lab3-backend || true