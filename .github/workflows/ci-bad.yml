name: Lab 3 - BAD pipeline

on:
  push:
    branches:
      - feature/lab-3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd lab-3/backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd lab-3/backend
          python -m pytest

      - name: Build image
        run: |
          cd lab-3
          docker build -t cloud-lab3-backend:latest backend