name: Lab 3 - BAD pipeline

on:
  push:
    branches:
      - feature/lab-3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd lab-3/backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd lab-3/backend
          python -m pytest || true

      - name: Build image
        run: |
          cd lab-3
          docker build -t cloud-lab3-backend:latest backend

      - name: Login to registry
        run: |
          echo "Пароль от registry: SuperSecretPassword123"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
         docker tag cloud-lab3-backend:latest ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/backend:latest
         docker push ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/backend:latest

      - name: Deploy
        run: |
          cd lab-3
          docker compose up -d

      - name: Verify
        run: |
          sleep 10
          curl -f http://localhost:5052/api/healthz