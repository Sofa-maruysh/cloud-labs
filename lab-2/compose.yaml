name: cloud-lab2

services:
  db:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab2-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m

  backend:
    image: cloud-lab2-backend:good
    build: ./backend
    environment:
      DATABASE_URL: postgresql://labuser:${POSTGRES_PASSWORD:-lab2-local-password}@db:5432/labdb
    networks: [web, data]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m

  frontend:
    image: cloud-lab2-frontend:good
    build: ./frontend
    ports:
      - "127.0.0.1:5052:8080"
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m

volumes:
  postgres_data:

networks:
  web:
  data:
    internal: true
