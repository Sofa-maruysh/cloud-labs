<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Список задач</h1>
    <p>Задачи сохраняются в PostgreSQL.</p>
    <form id="task-form">
      <label for="text">Новая задача</label>
      <div class="form-row">
        <input id="text" name="text" maxlength="200" required placeholder="Например, выполнить лабораторную">
        <button type="submit">Добавить</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <h2>Сохранённые задачи</h2>
    <ul id="tasks"></ul>
  </main>
</body>
</html>
