worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    log_format main '$remote_addr - $host [$time_local] "$request" $status '
                    'upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream backend_pool {
        server backend-1:5000 max_fails=1 fail_timeout=5s;
        server backend-2:5000 max_fails=1 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1 lab1.local other.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        return 404;
    }

    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1 lab1.local;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;
        proxy_intercept_errors on;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 4s;
        }

        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            alias /usr/share/nginx/docs/;
            index index.html;
            autoindex on;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            auth_basic "Admin area";
            auth_basic_user_file /etc/nginx/htpasswd;
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            internal;
        }

        location = /50x.html {
            internal;
        }
    }

    server {
        listen 443 ssl;
        server_name other.local;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/second-project;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}

