<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Админка — только для своих</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>/admin</h1>
    <p>Этот раздел закрыт <code>auth_basic</code>. Если вы видите страницу — базовая авторизация nginx отработала: запрос прошёл с верным логином и паролем из файла <code>htpasswd</code>.</p>
    <p>Без пароля nginx отвечает <code>401</code> и страницу не отдаёт.</p>
  </main>
</body>
</html>
